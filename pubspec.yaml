name: hanumanchalisa
description: Read and recite the Shri Hanuman Chalisa with meaning, transliteration and a mala counter.
publish_to: 'none'
version: 3.0.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.2.0
  just_audio: '>=0.9.36 <0.11.0'
  just_audio_background: '>=0.0.1-beta.11 <0.1.0'
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#D84315"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/music/
    - assets/images/
    - assets/sounds/
    - assets/icon/icon_foreground.png
