name: hanumanchalisa
description: Read and recite the Shri Hanuman Chalisa with meaning, transliteration and a mala counter.
publish_to: 'none'
version: 2.1.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.2.0
  just_audio: '>=0.9.36 <0.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#D84315"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/male/
    - assets/audio/female/
    - assets/sounds/
    - assets/icon/icon_foreground.png
