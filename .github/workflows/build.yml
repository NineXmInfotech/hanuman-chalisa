name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.bhaktiapps --project-name hanuman_chalisa .
          sed -i 's/android:label="hanuman_chalisa"/android:label="Hanuman Chalisa"/' android/app/src/main/AndroidManifest.xml
          # Use the older, widely compatible graphics engine (avoids stuck screens on some phones)
          sed -i '0,/<activity/s//<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" \/>\n        <activity/' android/app/src/main/AndroidManifest.xml
          # Let the app find the phone's text-to-speech engine (Android 11+)
          M=android/app/src/main/AndroidManifest.xml
          if grep -q '<queries>' $M; then
            sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>#' $M
          else
            sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' $M
          fi
          cat $M
          flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk hanuman-chalisa-v1.0.${{ github.run_number }}.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          body: Download the .apk file below on your Android phone and install it to test.
          prerelease: true
          files: hanuman-chalisa-v1.0.${{ github.run_number }}.apk
