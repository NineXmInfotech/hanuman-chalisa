name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore:
      - tools/**
      - .github/workflows/generate-audio.yml
      - .github/workflows/fetch-assets.yml
      - .github/workflows/fetch-reference.yml
      - .github/workflows/find-media.yml
      - website/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.ninexminfotech --project-name hanumanchalisa .
          python3 tools/patch_android.py
          flutter --version

      - name: Get packages and app icon
        run: |
          flutter pub get 2>&1 | tee build.log
          dart run flutter_launcher_icons

      - name: Build APK (for testing) and AAB (for Play Store)
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log
          flutter build appbundle --release --build-number=${{ github.run_number }} 2>&1 | tee -a build.log

      - name: Sign with the permanent upload key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          N=${{ github.run_number }}
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          mkdir -p out
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::SIGNING_PASSWORD secret not set - this build uses a temporary test key and cannot be uploaded to Google Play."
            cp $APK out/hanuman-chalisa-test-$N.apk
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-signing/upload-keystore.jks.enc -out upload.jks -pass env:SIGNING_PASSWORD
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner sign --ks upload.jks --ks-key-alias upload --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out out/hanuman-chalisa-$N.apk $APK
          $BT/apksigner verify out/hanuman-chalisa-$N.apk
          cp $AAB out/hanuman-chalisa-$N.aab
          zip -d out/hanuman-chalisa-$N.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.MF' || true
          jarsigner -keystore upload.jks -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 out/hanuman-chalisa-$N.aab upload
          jarsigner -verify out/hanuman-chalisa-$N.aab
          rm upload.jks

      - name: Publish downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            .apk = install on your phone to test
            .aab = upload to Google Play Console (only present when the signing password is set)
          prerelease: true
          files: out/*

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildlog-${{ github.run_number }}
          name: Build log ${{ github.run_number }}
          prerelease: true
          files: build.log
